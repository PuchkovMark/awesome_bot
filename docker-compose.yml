services:
  migrate:
    build:
      context: .
      target: builder
    command: npx prisma migrate deploy
    env_file: .env
    volumes:
      - ./prisma:/usr/src/app/prisma
    restart: "no"

  app:
    build: .
    env_file: .env
    volumes:
      - ./prisma:/usr/src/app/prisma
      - ./logs:/usr/src/app/logs
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
